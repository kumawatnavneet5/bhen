<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Dhanteras ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#1b0633;--plum:#3a0d55;--magenta:#d6246e;--marigold:#ff9f1c;--gold:#ffd166;--cream:#fff3d6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--plum),var(--night) 70%);color:var(--cream);font-family:'Poppins',system-ui,sans-serif;overflow-x:hidden;text-align:center}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 40px}
h1,h2{font-family:'Yatra One',Georgia,serif;font-weight:400;margin:0}
.hidden{display:none!important}
/* intro */
#intro p{max-width:30ch;margin:10px auto 22px;opacity:.85}
#intro h2{font-size:2.1rem;color:var(--gold)}
input[type=text]{font:inherit;padding:14px 18px;border-radius:999px;border:2px solid var(--gold);background:rgba(255,255,255,.08);color:var(--cream);width:min(280px,80vw);text-align:center;outline:none}
input[type=text]:focus-visible{box-shadow:0 0 0 4px rgba(255,209,102,.4)}
.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:14px 26px;color:#2a0a3a;background:linear-gradient(135deg,var(--gold),var(--marigold));box-shadow:0 8px 24px rgba(255,159,28,.35);transition:transform .2s}
.btn:hover{transform:scale(1.06)}.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#intro .btn{margin-top:16px}
/* diya */
.diya{width:120px;height:120px;position:relative;margin:0 auto 6px}
.diya .bowl{position:absolute;bottom:14px;left:10px;width:100px;height:44px;border-radius:0 0 100px 100px;background:linear-gradient(#e0701a,#8c2f0e);box-shadow:0 0 40px 8px rgba(255,159,28,.5)}
.diya .flame{position:absolute;bottom:52px;left:50%;width:26px;height:56px;margin-left:-13px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 75%,#fff7c2,var(--marigold) 55%,#e8431a);transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #ffb347)}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.05,.95) rotate(-1deg)}}
/* headline */
.eyebrow{font-size:1rem;color:var(--gold);margin:8px 0 4px}
h1{font-size:clamp(2.4rem,11vw,5rem);line-height:1.05;color:var(--gold);text-shadow:0 0 30px rgba(255,159,28,.6)}
h1 span{display:inline-block;opacity:0;transform:translateY(40px) scale(.6) rotate(-8deg);animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.name{font-family:'Yatra One',Georgia,serif;font-size:clamp(2rem,9vw,3.6rem);margin:6px 0 4px;background:linear-gradient(90deg,#ff7eb3,var(--gold),#ff7eb3);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.sub{max-width:34ch;margin:8px auto 24px;opacity:.9}
/* buttons */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(420px,100%)}
.tile{font:inherit;font-weight:600;cursor:pointer;color:var(--cream);padding:18px 10px;border-radius:20px;border:1.5px solid rgba(255,209,102,.55);background:rgba(255,255,255,.07);backdrop-filter:blur(6px);transition:transform .2s,background .2s;animation:bob 3s ease-in-out infinite}
.tile:nth-child(2){animation-delay:.4s}.tile:nth-child(3){animation-delay:.8s}.tile:nth-child(4){animation-delay:1.2s}
.tile:hover{background:rgba(255,209,102,.18)}
.tile:active{transform:scale(.93)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.tile i{display:block;font-style:normal;font-size:1.9rem;margin-bottom:4px}
.tile.wide{grid-column:1/-1}
@keyframes bob{50%{transform:translateY(-5px)}}
.row{display:flex;gap:10px;justify-content:center;margin-top:20px;min-height:46px;flex-wrap:wrap}
.row .mini{width:46px;height:46px;position:relative;animation:pop .5s forwards;opacity:0}
.mini::before{content:"🪔";font-size:2rem;filter:drop-shadow(0 0 12px #ffb347);animation:flick 1s ease-in-out infinite alternate;display:block}
.from{margin-top:26px;opacity:.8}
/* modal */
#modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(15,2,28,.7);padding:20px}
#modal.on{display:flex}
.card{position:relative;max-width:360px;width:100%;padding:30px 24px;border-radius:26px;background:linear-gradient(160deg,#4a1470,#2a0846);border:2px solid var(--gold);box-shadow:0 0 60px rgba(255,159,28,.4);animation:zoom .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes zoom{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.card h2{color:var(--gold);font-size:1.7rem;margin-bottom:10px}
.card p{line-height:1.6;margin:0 0 18px}
.frame{width:220px;height:260px;margin:0 auto 16px;border-radius:120px 120px 16px 16px;padding:10px;background:conic-gradient(from 0deg,var(--gold),var(--magenta),var(--gold),var(--marigold),var(--gold));animation:spin 6s linear infinite}
@keyframes spin{to{filter:hue-rotate(40deg)}}
.frame div{width:100%;height:100%;border-radius:110px 110px 8px 8px;background:#2a0846 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:.9rem;padding:14px}
.close{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--cream);font-size:1.6rem;cursor:pointer}
.close:focus-visible{outline:2px solid var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap">
  <section id="intro">
    <div class="diya" aria-hidden="true"><div class="flame"></div><div class="bowl"></div></div>
    <h2>A little light for you</h2>
    <p>A little Dhanteras surprise is waiting for you.</p>
    <button class="btn" id="go">Open my wish</button>
  </section>

  <section id="main" class="hidden">
    <div class="diya" aria-hidden="true"><div class="flame"></div><div class="bowl"></div></div>
    <p class="eyebrow">Shubh Dhanteras</p>
    <h1 id="hl" aria-label="Happy Dhanteras"></h1>
    <div class="name" id="who">Bhen ✨</div>
    <p class="sub">Tap the buttons below. Every one has something shiny for you.</p>
    <div class="grid">
      <button class="tile" data-a="diya"><i>🪔</i>Light a diya</button>
      <button class="tile" data-a="gold"><i>🪙</i>Gold shower</button>
      <button class="tile" data-a="wish"><i>💌</i>My wish</button>
      <button class="tile" data-a="photo"><i>🖼️</i>Your frame</button>
      <button class="tile wide" data-a="boom"><i>🎆</i>Fireworks</button>
    </div>
    <div class="row" id="row" aria-live="polite"></div>
    
  </section>
</main>

<div id="modal" role="dialog" aria-modal="true"><div class="card"><button class="close" id="x" aria-label="Close">×</button><div id="body"></div></div></div>

<script>
(function(){
var cv=document.getElementById('fx'),cx=cv.getContext('2d'),W,H,P=[],reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
function coin(x,y,burst){var a=Math.random()*6.28,s=burst?4+Math.random()*7:0;
  P.push({t:'c',x:x,y:y,vx:Math.cos(a)*s,vy:burst?Math.sin(a)*s-4:1.5+Math.random()*2.5,r:6+Math.random()*8,ph:Math.random()*6,g:.12,life:burst?140:9999})}
function spark(x,y){var n=70,h=Math.random()*360;for(var i=0;i<n;i++){var a=i/n*6.28,s=2+Math.random()*5;
  P.push({t:'s',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2.2,h:h+Math.random()*40,g:.06,life:70+Math.random()*30})}}
function rain(n){for(var i=0;i<n;i++)coin(Math.random()*W,-20-Math.random()*H*.6,false)}
function frame(){cx.clearRect(0,0,W,H);
  for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.life--;p.ph=(p.ph||0)+.12;
    if(p.t==='c'){var w=Math.abs(Math.cos(p.ph))*p.r+1;cx.fillStyle='#ffd166';cx.strokeStyle='#e09f1f';cx.lineWidth=2;
      cx.beginPath();cx.ellipse(p.x,p.y,w,p.r,0,0,6.28);cx.fill();cx.stroke();
      if(p.g===.12&&p.life<9000){p.vy*=.99}
      if(p.y>H+30||p.life<=0){if(p.life>9000){p.y=-20;p.x=Math.random()*W}else P.splice(i,1)}}
    else{cx.fillStyle='hsla('+p.h+',100%,65%,'+Math.max(p.life/90,0)+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();if(p.life<=0)P.splice(i,1)}}
  requestAnimationFrame(frame)}
frame();
var rainOn=false;
function startRain(){if(rainOn||reduce)return;rainOn=true;rain(26)}
function burstCoins(){var x=W/2,y=H*.55;for(var i=0;i<40;i++)coin(x,y,true)}
function boom(){var k=0;(function f(){spark(80+Math.random()*(W-160),80+Math.random()*H*.4);if(++k<5)setTimeout(f,260)})()}

var $=function(i){return document.getElementById(i)},name='';
function go(){
  $('intro').classList.add('hidden');$('main').classList.remove('hidden');
  var h=$('hl'),words='Happy Dhanteras!'.split(''),d=0;
  words.forEach(function(c,i){var s=document.createElement('span');s.textContent=c===' '?'\u00a0':c;s.style.animationDelay=(i*.06+.2)+'s';h.appendChild(s)});
  startRain();setTimeout(boom,900);}
$('go').onclick=go;
